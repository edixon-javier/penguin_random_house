<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ambiente Futbolero · Informe de Premiación</title>
<style>
/* ============================================================
   Ambiente Futbolero · Informe de Premiación
   Motion graphics sobre las láminas originales del PDF:
   cada página se recorta en piezas (logo, título, medalla,
   actas, premio, foto, balón…) que entran animadas y aterrizan
   pixel-perfect sobre su posición original.
   ============================================================ */
:root{
  --navy:#001333;
  --navy-2:#00205b;
  --blue:#0b5ed7;
  --cyan:#19a7e8;
  --cyan-2:#4fd2ff;
  --ink:#e8f2ff;
  --ease:cubic-bezier(.16,.84,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000a1f;
  color:var(--ink);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ---------- escenario 16:9 ---------- */
#wrap{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(90% 90% at 50% 10%, #04264f 0%, #011530 55%, #000a1f 100%);
}
#stage{
  position:relative;
  width:min(100vw, calc((100vh - 76px) * 16 / 9));
  aspect-ratio:16/9;
  background:#001333;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(79,210,255,.12);
}
@media (max-width:820px){
  #stage{width:min(100vw, calc((100vh - 58px) * 16 / 9));border-radius:0}
}

/* ---------- diapositivas y piezas ---------- */
.slide{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;pointer-events:none;
}
.slide.on{opacity:1;visibility:visible;pointer-events:auto}
.slide.bye{
  opacity:0;visibility:visible;
  transition:opacity .38s ease;
}
.pc{ /* pieza recortada */
  position:absolute;overflow:hidden;opacity:0;
  transform:translateZ(0);
  will-change:transform,opacity,clip-path;
}
.pc>img{
  position:absolute;display:block;
  pointer-events:none;
}
.slide.on .pc{
  animation-name:var(--kf);
  animation-duration:var(--t,.8s);
  animation-delay:var(--d,0s);
  animation-timing-function:var(--ez,var(--ease));
  animation-fill-mode:both;
}

/* ---------- animaciones de entrada ---------- */
@keyframes kfFade{from{opacity:0}to{opacity:1}}
@keyframes kfRise{from{opacity:0;transform:translateY(30px)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes kfDrop{from{opacity:0;transform:translateY(-28px)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes kfFromL{from{opacity:0;transform:translateX(-42px)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes kfFromR{from{opacity:0;transform:translateX(42px)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes kfPop{
  from{opacity:0;transform:scale(.78)}
  60%{opacity:1;transform:scale(1.035)}
  to{opacity:1;transform:scale(1)}
}
@keyframes kfWipeL{ /* se revela desde el borde derecho hacia la izquierda */
  from{opacity:1;clip-path:inset(0 0 0 100%)}
  to{opacity:1;clip-path:inset(0 0 0 0)}
}
@keyframes kfWipeUp{ /* se revela de abajo hacia arriba */
  from{opacity:1;clip-path:inset(100% 0 0 0)}
  to{opacity:1;clip-path:inset(0 0 0 0)}
}
@keyframes kfBase{ /* base fantasma: la lámina completa atenuada bajo las piezas */
  from{opacity:0;filter:brightness(.42) saturate(.72)}
  to{opacity:1;filter:brightness(.42) saturate(.72)}
}
@keyframes kfDimBase{ /* base completa: aparece atenuada y se enciende al final */
  0%{opacity:0;filter:brightness(.3) saturate(.75)}
  22%{opacity:1;filter:brightness(.3) saturate(.75)}
  70%{opacity:1;filter:brightness(.3) saturate(.75)}
  100%{opacity:1;filter:brightness(1) saturate(1)}
}

/* ---------- barrido de luz ambiental ---------- */
.sweep{
  position:absolute;inset:0;z-index:90;pointer-events:none;
  background:linear-gradient(105deg,
    transparent 42%, rgba(160,220,255,.075) 50%, transparent 58%);
  background-size:260% 100%;
  background-position:120% 0;
  mix-blend-mode:screen;
  opacity:0;
}
.slide.on .sweep{
  animation:sweepMove 3.4s ease-in-out 1.2s 1 both;
}
@keyframes sweepMove{
  0%{opacity:0;background-position:130% 0}
  15%{opacity:1}
  85%{opacity:1}
  100%{opacity:0;background-position:-30% 0}
}

/* ---------- interfaz ---------- */
#bar{
  position:fixed;top:0;left:0;height:3px;z-index:120;
  background:linear-gradient(90deg,var(--cyan),var(--cyan-2));
  box-shadow:0 0 12px rgba(79,210,255,.8);
  transition:width .45s var(--ease);
}
#ui{
  position:fixed;left:0;right:0;bottom:0;z-index:110;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
}
.btn{
  appearance:none;border:1px solid rgba(79,210,255,.35);
  background:rgba(0,19,51,.72);color:var(--ink);
  width:42px;height:42px;border-radius:50%;
  font-size:1rem;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{background:rgba(11,94,215,.55);border-color:var(--cyan-2);transform:translateY(-2px)}
.btn:active{transform:scale(.94)}
.btn.tog{border-color:var(--cyan-2);background:rgba(25,167,232,.35)}
#dots{display:flex;gap:7px;align-items:center;padding:0 6px}
.dot{
  width:8px;height:8px;border-radius:50%;cursor:pointer;
  background:rgba(232,242,255,.25);
  transition:all .25s var(--ease);
}
.dot.cur{background:var(--cyan-2);transform:scale(1.35);box-shadow:0 0 10px rgba(79,210,255,.9)}
#count{
  font-variant-numeric:tabular-nums;font-size:.82rem;letter-spacing:.12em;
  color:#9dc4f5;min-width:56px;text-align:center;
}
#hint{
  position:fixed;bottom:74px;left:50%;transform:translateX(-50%);
  z-index:105;font-size:.72rem;letter-spacing:.14em;color:#7ea9dd;
  background:rgba(0,19,51,.6);border:1px solid rgba(79,210,255,.2);
  padding:.5em 1.2em;border-radius:100px;white-space:nowrap;
  animation:hintOut 1s ease 6.5s both;
  pointer-events:none;
}
@keyframes hintOut{to{opacity:0;visibility:hidden}}
@media (max-width:820px){
  #dots{display:none}
  #hint{display:none}
  .btn{width:38px;height:38px}
}

/* ---------- cargador ---------- */
#loader{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(100% 100% at 50% 20%, #06315f 0%, #001a3d 55%, #000a1f 100%);
  transition:opacity .7s ease, visibility .7s;
}
#loader.hide{opacity:0;visibility:hidden}
#loader .t1{
  font-size:clamp(1.6rem,5vw,2.6rem);font-weight:300;font-style:italic;letter-spacing:.01em
}
#loader .t1 b{font-weight:800}
#loader .t2{font-size:.78rem;letter-spacing:.3em;color:#8fc1ef;text-transform:uppercase}
.ring{
  width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(79,210,255,.2);border-top-color:var(--cyan-2);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce){
  .slide.on .pc{animation-duration:.01s !important;animation-delay:0s !important}
  .slide.on .sweep{animation:none}
}
</style>
</head>
<body>

<div id="wrap"><div id="stage" aria-label="Presentación Ambiente Futbolero"></div></div>

<div id="bar"></div>
<div id="hint">← → NAVEGAR · ESPACIO SIGUIENTE · R REPETIR · F PANTALLA COMPLETA</div>
<div id="ui">
  <button class="btn" id="bPrev" title="Anterior (←)">◀</button>
  <div id="dots"></div>
  <button class="btn" id="bNext" title="Siguiente (→)">▶</button>
  <span id="count">1 / 12</span>
  <button class="btn" id="bPlay" title="Reproducción automática (P)">⏵</button>
  <button class="btn" id="bReplay" title="Repetir animación (R)">↻</button>
  <button class="btn" id="bFull" title="Pantalla completa (F)">⛶</button>
</div>

<div id="loader">
  <div class="t1">Ambiente <b>Futbolero</b></div>
  <div class="ring"></div>
  <div class="t2">Cargando informe…</div>
</div>

<script>
/* ============================================================
   Configuración de recortes.
   Cada pieza: [x, y, w, h, efecto, delay(s), dur(s)]
   Coordenadas en % de la lámina (1600×900). Un "bleed" de 0.45%
   se añade automáticamente para que las piezas solapen y no se
   vean costuras al aterrizar.
   ============================================================ */
const FX = {
  fade : 'kfFade',
  rise : 'kfRise',
  drop : 'kfDrop',
  fromL: 'kfFromL',
  fromR: 'kfFromR',
  pop  : 'kfPop',
  wipeL: 'kfWipeL',
  wipeUp:'kfWipeUp',
  dim  : 'kfDimBase',
  base : 'kfBase',
};

/* La lámina completa, atenuada, bajo todas las piezas: mientras los
   elementos vuelan a su sitio se ve su "sombra" en vez de un hueco. */
const GHOST = [0, 0, 100, 100, 'base', 0, .5];

/* Rellenos de fondo comunes de las láminas de ganador (aparecen
   primero, sin movimiento, y completan el 100% de la lámina). */
const GAN_FILL = [
  [ 0.0,  0.0,  9.6, 100 , 'fade', .00, .55],
  [22.4,  0.0, 41.2,  9.2, 'fade', .06, .55],
  [22.4,  8.8, 23.0,  7.6, 'fade', .08, .55],
  [ 9.4, 46.0,  2.6, 43.0, 'fade', .20, .55],
  [63.0,  0.0, 29.5,  8.4, 'fade', .10, .55],
  [91.8,  0.0,  8.2, 77.0, 'fade', .10, .55],
  [ 8.8, 15.8, 37.4,  5.8, 'fade', .14, .55],
  [44.8,  7.6, 18.6, 12.0, 'fade', .14, .55],
  [58.0,  9.0,  3.6, 38.5, 'fade', .16, .55],
  [ 8.8, 41.6, 53.4,  5.6, 'fade', .18, .55],
  [19.8, 87.6, 24.4, 13.0, 'fade', .22, .55],
  [43.8, 92.0, 17.8,  8.5, 'fade', .22, .55],
  [60.6, 93.6, 24.0,  7.0, 'fade', .22, .55],
  [ 8.8, 91.0, 12.4,  9.5, 'fade', .22, .55],
];

/* Piezas de contenido de una lámina de ganador estándar. */
const GAN_CONTENT = [
  [ 8.8,  0.0, 14.8, 17.6, 'drop', .45, .70],   // logo Philips
  [ 9.5, 20.0, 35.5, 23.5, 'fromL',.70, .85],   // título Ambiente Futbolero
  [45.6, 18.8, 13.0, 24.6, 'pop', 1.10, .70],   // medalla GANADOR
  [62.6,  7.8, 29.9, 14.6, 'fromR',1.45, .80],  // tarjeta con datos del ganador
  [60.8, 21.2, 33.4, 73.6, 'wipeUp',1.75,.95],  // foto de entrega
  [11.5, 46.0, 16.5, 42.5, 'rise', 2.15, .75],  // acta 1
  [27.5, 46.0, 16.0, 42.5, 'rise', 2.32, .75],  // acta 2
  [43.8, 47.0, 17.4, 45.5, 'rise', 2.52, .80],  // tarjeta del premio
  [ 8.8, 83.4, 12.6,  9.4, 'fade', 2.85, .60],  // logo Equipo GC
  [83.2, 75.6, 16.8, 24.4, 'pop', 2.95, .70],   // balón
];

function ganador(img){ return { img, hold:8000, pieces:[GHOST, ...GAN_FILL, ...GAN_CONTENT] }; }

const SLIDES = [

  /* ---- 1 · Portada ---- */
  { img:'assets/p-01.jpg', hold:6500, pieces:[
    GHOST,
    [ 0.0,  0.0, 10.0,100.0, 'fade', .00, .55],
    [22.4,  0.0, 22.6, 27.0, 'fade', .06, .55],
    [ 8.8, 17.0, 14.0,  9.5, 'fade', .10, .55],
    [ 9.0, 47.5, 36.0, 11.0, 'fade', .14, .55],
    [ 9.0, 67.5, 36.0, 16.5, 'fade', .18, .55],
    [20.6, 83.0, 24.4, 17.5, 'fade', .20, .55],
    [ 9.0, 91.5, 13.0,  9.0, 'fade', .20, .55],
    [43.5,  0.0, 56.5,100.0, 'wipeL', .25, 1.15], // foto estadio
    [ 8.8,  0.0, 14.8, 17.6, 'drop', .95, .70],   // logo Philips
    [ 9.5, 26.0, 36.0, 23.0, 'fromL',1.25, .90],  // título
    [ 9.5, 57.0, 35.5, 11.5, 'rise', 1.75, .75],  // informe premiación
    [ 8.8, 82.6, 12.6,  9.6, 'fade', 2.05, .60],  // Equipo GC
  ]},

  /* ---- 2..3 · Ganadores 1 y 2 ---- */
  ganador('assets/p-02.jpg'),
  ganador('assets/p-03.jpg'),

  /* ---- 4 · Ganador 3 · desistimiento (layout propio) ---- */
  { img:'assets/p-04.jpg', hold:9000, pieces:[
    GHOST,
    [ 0.0,  0.0,  9.6,100.0, 'fade', .00, .55],
    [22.4,  0.0, 25.6,  9.0, 'fade', .06, .55],
    [47.6,  0.0, 22.6,  9.0, 'fade', .08, .55],
    [69.8,  0.0, 30.5,  9.0, 'fade', .10, .55],
    [71.8,  8.6, 23.6, 24.5, 'fade', .12, .55],
    [25.2, 83.0,  2.8,  6.6, 'fade', .20, .55],
    [95.0,  8.6,  5.5, 68.0, 'fade', .10, .55],
    [ 8.8, 15.8, 38.0,  5.6, 'fade', .14, .55],
    [ 8.8, 41.6, 17.0, 10.0, 'fade', .16, .55],
    [21.8, 41.6, 25.4,  5.8, 'fade', .18, .55],
    [22.0, 47.0,  3.6, 42.0, 'fade', .18, .55],
    [ 8.8, 74.8, 13.6,  9.6, 'fade', .20, .55],
    [69.8,  8.6,  2.6, 83.0, 'fade', .20, .55],
    [47.0, 74.5, 23.6, 26.0, 'fade', .22, .55],
    [43.6, 81.5,  5.0, 19.0, 'fade', .22, .55],
    [21.6, 88.6, 27.0, 12.0, 'fade', .22, .55],
    [70.0, 89.5, 14.5, 11.0, 'fade', .22, .55],
    [ 8.8, 91.0, 13.0,  9.5, 'fade', .22, .55],
    [ 8.8,  0.0, 14.8, 17.6, 'drop', .45, .70],   // logo Philips
    [ 9.5, 20.0, 35.5, 23.5, 'fromL',.70, .85],   // título
    [ 9.5, 50.5, 13.0, 25.5, 'pop', 1.05, .70],   // medalla GANADOR 3
    [47.4,  8.0, 23.0, 67.5, 'fromR',1.40, .85],  // carta de desistimiento pág. 1
    [71.6, 32.0, 24.0, 59.0, 'fromR',1.70, .85],  // carta de desistimiento pág. 2
    [25.0, 46.0, 21.6, 37.5, 'rise', 2.10, .80],  // kit futbolero
    [28.2, 81.0, 16.4,  9.4, 'rise', 2.35, .70],  // etiqueta KIT FUTBOLERO
    [ 8.8, 83.4, 12.6,  9.4, 'fade', 2.70, .60],  // Equipo GC
    [83.2, 75.6, 16.8, 24.4, 'pop', 2.85, .70],   // balón
  ]},

  /* ---- 5..11 · Ganadores 4 a 10 ---- */
  ganador('assets/p-05.jpg'),
  ganador('assets/p-06.jpg'),
  ganador('assets/p-07.jpg'),
  ganador('assets/p-08.jpg'),
  ganador('assets/p-09.jpg'),
  ganador('assets/p-10.jpg'),
  ganador('assets/p-11.jpg'),

  /* ---- 12 · Gracias ---- */
  { img:'assets/p-12.jpg', hold:8000, pieces:[
    [ 0.0,  0.0,100.0,100.0, 'dim', .00, 3.30],   // lámina completa (atenuada → encendido)
    [37.5, 40.0, 26.0, 21.0, 'pop', 1.20, .85],   // ¡GRACIAS!
    [26.5, 70.5, 47.0, 14.5, 'rise', 1.95, .80],  // texto legal
    [ 7.0, 83.5, 14.5, 11.0, 'fade', 2.55, .70],  // Signify
    [79.5, 84.0, 13.0, 10.0, 'fade', 2.55, .70],  // Equipo GC
  ]},
];

/* ============================================================
   Construcción del DOM
   ============================================================ */
const stage = document.getElementById('stage');
const BLEED = 0.45;
const N = SLIDES.length;
let cur = 0, playing = false, playTimer = null;

SLIDES.forEach((s, i) => {
  const sl = document.createElement('div');
  sl.className = 'slide';
  sl.dataset.i = i;
  s.pieces.forEach((p, j) => {
    const [x, y, w, h, fx, d, t] = p;
    const x0 = Math.max(0, x - BLEED), y0 = Math.max(0, y - BLEED);
    const x1 = Math.min(100, x + w + BLEED), y1 = Math.min(100, y + h + BLEED);
    const W = x1 - x0, H = y1 - y0;
    const pc = document.createElement('div');
    pc.className = 'pc';
    pc.style.cssText =
      `left:${x0}%;top:${y0}%;width:${W}%;height:${H}%;z-index:${j + 1};` +
      `--kf:${FX[fx]};--d:${d}s;--t:${t}s;`;
    const im = document.createElement('img');
    im.src = s.img;
    im.alt = '';
    im.draggable = false;
    im.style.cssText =
      `width:${10000 / W}%;left:${-x0 * 100 / W}%;top:${-y0 * 100 / H}%;`;
    pc.appendChild(im);
    sl.appendChild(pc);
  });
  const sweep = document.createElement('div');
  sweep.className = 'sweep';
  sl.appendChild(sweep);
  stage.appendChild(sl);
});

const slides = [...stage.children];
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const dotsBox = document.getElementById('dots');

for (let i = 0; i < N; i++) {
  const d = document.createElement('span');
  d.className = 'dot';
  d.title = 'Diapositiva ' + (i + 1);
  d.onclick = () => go(i);
  dotsBox.appendChild(d);
}
const dots = [...dotsBox.children];

function paintUI(){
  bar.style.width = ((cur + 1) / N * 100) + '%';
  count.textContent = (cur + 1) + ' / ' + N;
  dots.forEach((d, i) => d.classList.toggle('cur', i === cur));
}

function show(i){
  slides.forEach((sl, j) => {
    if (j === i) { sl.classList.remove('bye'); sl.classList.add('on'); }
    else if (sl.classList.contains('on')) {
      sl.classList.remove('on'); sl.classList.add('bye');
      setTimeout(() => sl.classList.remove('bye'), 420);
    }
  });
  paintUI();
  armAutoplay();
}

function go(i){
  if (i === cur) return;
  cur = (i + N) % N;
  show(cur);
}
const next = () => go(cur + 1);
const prev = () => go(cur - 1);

function replay(){
  const sl = slides[cur];
  sl.classList.remove('on');
  void sl.offsetWidth;
  sl.classList.add('on');
  armAutoplay();
}

/* ---------- autoplay ---------- */
const bPlay = document.getElementById('bPlay');
function armAutoplay(){
  clearTimeout(playTimer);
  if (!playing) return;
  playTimer = setTimeout(() => { cur = (cur + 1) % N; show(cur); }, SLIDES[cur].hold);
}
function togglePlay(){
  playing = !playing;
  bPlay.classList.toggle('tog', playing);
  bPlay.textContent = playing ? '⏸' : '⏵';
  armAutoplay();
}

/* ---------- controles ---------- */
document.getElementById('bNext').onclick = next;
document.getElementById('bPrev').onclick = prev;
document.getElementById('bReplay').onclick = replay;
bPlay.onclick = togglePlay;
document.getElementById('bFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(N - 1);
  else if (e.key === 'r' || e.key === 'R') replay();
  else if (e.key === 'p' || e.key === 'P') togglePlay();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('bFull').click();
});

/* toque: mitad izquierda atrás, mitad derecha adelante; swipe */
let tx = null;
stage.addEventListener('pointerdown', e => { tx = e.clientX; });
stage.addEventListener('pointerup', e => {
  if (tx === null) return;
  const dx = e.clientX - tx; tx = null;
  if (Math.abs(dx) > 45) { dx < 0 ? next() : prev(); return; }
  const r = stage.getBoundingClientRect();
  (e.clientX - r.left) / r.width < .3 ? prev() : next();
});

/* ---------- precarga e inicio ---------- */
const urls = [...new Set(SLIDES.map(s => s.img))];
Promise.all(urls.map(u => new Promise(res => {
  const im = new Image();
  im.onload = im.onerror = () => res();
  im.src = u;
}))).then(() => {
  document.getElementById('loader').classList.add('hide');
  setTimeout(() => show(0), 350);
});
paintUI();
</script>
</body>
</html>
